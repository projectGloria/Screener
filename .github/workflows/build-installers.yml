name: Build Extension Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          if [[ -z "$MANIFEST_VERSION" || "$MANIFEST_VERSION" == "null" ]]; then
            echo "Error: Could not read version from manifest.json" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
              echo "Error: Tag version ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)" >&2
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$MANIFEST_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging Screener v$VERSION"

      - name: Package extension archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE_DIR="build/extension"
          OUT_DIR="installers"
          ARCHIVE_NAME="screener-${VERSION}-chrome.zip"

          mkdir -p "$STAGE_DIR" "$OUT_DIR"

          cp manifest.json \
             background.js \
             content.js \
             database.js \
             export.js \
             geometry.js \
             popup.html \
             popup.js \
             preview.html \
             preview.js \
             progress.css \
             styles.css \
             LICENSE \
             "$STAGE_DIR/"
          cp -r icons "$STAGE_DIR/"

          (cd "$STAGE_DIR" && zip -r "../../${OUT_DIR}/${ARCHIVE_NAME}" .)
          ls -lh "${OUT_DIR}/${ARCHIVE_NAME}"

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
