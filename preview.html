<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your capture · Screener</title><link rel="stylesheet" href="styles.css"></head>
<body class="preview"><header class="toolbar"><div class="brand"><span class="logo">S</span><span>Screener</span><span class="divider"></span><span class="muted">Your capture</span></div><div class="actions"><button id="zoom" class="secondary" disabled>Actual size</button><button id="copy" class="secondary" disabled>Copy image</button><select id="format" class="secondary" aria-label="Download format" disabled><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option><option value="pdf">PDF</option></select><button id="download" class="solid" disabled>Download PNG <span>↓</span></button></div></header>
<main class="preview-main"><div class="capture-heading"><div><div class="eyebrow" id="mode">YOUR SCREENSHOT</div><h1 id="title">Preparing your capture…</h1><p id="details" class="muted" role="status"></p></div><span class="local-label"><span class="dot"></span> Stored locally</span></div><p id="export-status" class="muted" role="status" aria-live="polite"></p><div class="image-stage" id="stage"><img id="image" alt="Captured webpage" hidden></div><p class="preview-note">Your page, preserved. Download to keep it — local previews are cleaned up after 24 hours when you next capture.</p></main>
<script type="module" src="preview.js"></script></body></html>
